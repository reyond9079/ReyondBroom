name: CI policy checks
'on':
  workflow_dispatch: null
  pull_request:
    paths:
    - .github/**
    - scripts/ci-*
    - tests/ci-*
    - scripts/build-audio.sh
    - scripts/setup-ci-renderer.ps1
    - scripts/test-compilation-runtime.py
    - scripts/test-audio-archive-windows.ps1
permissions:
  contents: read
concurrency:
  group: ci-policy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.2
    - run: python tests/ci-policy.py
    - name: Lint workflows and reusable action expressions
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$RUNNER_TEMP/actionlint"
        gh release download v1.7.7 --repo rhysd/actionlint --dir "$RUNNER_TEMP/actionlint" --pattern 'actionlint_1.7.7_linux_amd64.tar.gz' --pattern 'actionlint_1.7.7_checksums.txt'
        (cd "$RUNNER_TEMP/actionlint" && sha256sum --ignore-missing -c actionlint_1.7.7_checksums.txt && tar -xf actionlint_1.7.7_linux_amd64.tar.gz actionlint)
        "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= .github/workflows/ci-plan.yml .github/workflows/ci-policy-checks.yml .github/workflows/compilation-profile-checks.yml .github/workflows/release-linux-ui-update.yml .github/workflows/audio-editor-checks.yml
  cache-contract:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check snapshot readers allow atomic producer replacement
      run: python tests/ci-snapshot-sharing.py
    - uses: msys2/setup-msys2@v2
      if: runner.os == 'Windows'
      with:
        msystem: MINGW64
        path-type: inherit
        update: false
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make git make
    - run: python scripts/ci-cache-probe.py
    - uses: ./.github/actions/build-dependency
      with:
        component: bullet
        source: .ci-deps/probe-source
        destination: .ci-deps/probe-build
        platform: cache-contract-${{ runner.os }}
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
      id: cold
    - run: python scripts/ci-cache-probe.py --clear-output
    - id: dependency
      uses: ./.github/actions/build-dependency
      with:
        component: bullet
        source: .ci-deps/probe-source
        destination: .ci-deps/probe-build
        platform: cache-contract-${{ runner.os }}
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
    - name: Require cold build and verified warm restore
      env:
        REUSED: ${{ steps.dependency.outputs.reused }}
        COLD: ${{ steps.cold.outputs.reused }}
      run: python -c "import os; assert os.environ['COLD'] == 'false', 'Cold build was not exercised'; assert os.environ['REUSED'] ==
        'true', 'Warm cache did not reuse verified outputs'"
