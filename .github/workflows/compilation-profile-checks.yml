name: Compilation profile parity
'on':
  pull_request:
    paths:
    - native/**
    - qc/**
    - tests/**
    - scripts/**
    - patches/**
    - runtime/**
    - .github/**
  workflow_dispatch:
    inputs:
      prepared_run_id:
        description: Reuse a Windows-editor artifact to reproduce OS input without recompiling unchanged C++
        required: false
        default: ''
      world_authoring_case:
        description: Reuse matching prepared Windows binaries for local road input or remaining World Architect acceptance
        type: choice
        options:
        - none
        - local
        - remaining
        - finish
        default: none
      plant_scene_only:
        description: Focus a prepared Windows run on plant map rendering diagnostics
        required: false
        default: ''
      validation_mode:
        description: Affected checks by default; full suites only on explicit request
        type: choice
        options:
        - affected
        - full
        default: affected
      validation_base:
        description: Validation baseline ref; default is PR base or latest published release (independent of SDK base)
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: compilation-profiles-${{ github.head_ref || github.ref_name }}-${{ inputs.prepared_run_id || 'full' }}
  cancel-in-progress: true
jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yml
    with:
      base: ${{ github.event.pull_request.base.sha || inputs.validation_base }}
      head: ${{ github.event.pull_request.head.sha || github.sha }}
      full: ${{ inputs.validation_mode == 'full' }}
      release: false
  windows-input-reproduction:
    if: github.event_name == 'workflow_dispatch' && inputs.prepared_run_id != ''
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
      PREPARED_RUN: ${{ inputs.prepared_run_id }}
      RB_QA_RENDERER: gl rb_qa_opengl.dll
      GALLIUM_DRIVER: llvmpipe
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Restore verified runtime and the compiled editor with matching sources
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force base, prepared, mesa | Out-Null
        gh release download v0.5.0-alpha.126 --repo $env:GITHUB_REPOSITORY --dir base --pattern '*-Windows-x64.zip' --pattern '*-Windows-x64.zip.sha256'
        if ($LASTEXITCODE) { throw 'Runtime download failed' }
        $sum = (Get-Content (Get-ChildItem base/*.sha256).FullName) -split '\s+'
        if ((Get-FileHash (Join-Path base $sum[1]) -Algorithm SHA256).Hash.ToLower() -ne $sum[0]) { throw 'Runtime checksum mismatch' }
        Expand-Archive (Get-ChildItem base/*.zip).FullName bundle
        gh run download $env:PREPARED_RUN --repo $env:GITHUB_REPOSITORY --name compilation-Windows-editor --dir prepared
        if ($LASTEXITCODE) { throw 'Prepared editor download failed' }
        $revision = (Get-Content prepared/compilation-editor-revision.txt).Trim()
        if ($revision -notmatch '^[a-fA-F0-9]{40}$') { throw 'Invalid prepared source revision' }
        # PR checkouts build a synthetic merge commit, which may no longer be
        # referenced by the current PR after a test-driver-only update.
        git fetch --no-tags --depth=1 origin $revision
        if ($LASTEXITCODE) { throw 'Cannot retrieve the prepared editor source revision' }
        python scripts/ci-verify-prepared.py --revision $revision
        if ($LASTEXITCODE) { throw 'Prepared sources or build recipes differ: rebuild the editor first' }
        Copy-Item prepared/fteplug_ftebroom_x64.dll bundle/ReyondBroom-Windows-x64 -Force
        Copy-Item prepared/ftebroom/csaddon.dat bundle/ReyondBroom-Windows-x64/ftebroom -Force
        Copy-Item prepared/tools/compilation-profile-probe.exe bundle/ReyondBroom-Windows-x64/tools -Force
        Copy-Item prepared/bin/fteqw64.exe bundle/ReyondBroom-Windows-x64/bin/fteqw64.exe -Force
        gh release download 25.3.3 --repo pal1000/mesa-dist-win --dir mesa --pattern mesa3d-25.3.3-release-msvc.7z
        if ($LASTEXITCODE) { throw 'Renderer download failed' }
        if ((Get-FileHash mesa/mesa3d-25.3.3-release-msvc.7z -Algorithm SHA256).Hash.ToLower() -ne '66b79057ba273c08daa03551a231995d48b8623bb1efa9f3a7c3e09792d8f1ba') { throw 'Renderer checksum mismatch' }
        & 'C:/Program Files/7-Zip/7z.exe' x mesa/mesa3d-25.3.3-release-msvc.7z '-omesa/extracted' -y
        if ($LASTEXITCODE) { throw 'Renderer extraction failed' }
        Copy-Item mesa/extracted/x64/*.dll bundle/ReyondBroom-Windows-x64/bin -Force
        Copy-Item mesa/extracted/x64/opengl32.dll bundle/ReyondBroom-Windows-x64/bin/rb_qa_opengl.dll -Force
        python -m pip install Pillow==12.0.0 pywinauto trimesh==4.8.3 numpy==2.3.4
    - name: Exercise actual Windows controls with OS input
      if: inputs.plant_scene_only != 'true' && (inputs.world_authoring_case == '' || inputs.world_authoring_case == 'none')
      run: python scripts/test-compilation-ui.py bundle/ReyondBroom-Windows-x64 qa/ui
    - name: Exercise the prepared World Architect with actual OS input
      if: inputs.world_authoring_case != '' && inputs.world_authoring_case != 'none'
      shell: pwsh
      run: |
        $runtime = 'bundle/ReyondBroom-Windows-x64'
        if (!(Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue)) { throw 'World input fixture requires a 1920x1080 test desktop' }
        Set-DisplayResolution -Width 1920 -Height 1080 -Force
        python scripts/ci-stage-assets.py $runtime
        if ($LASTEXITCODE) { throw 'Current prepared runtime assets could not be staged' }
        python tests/make-linux-build-fixture.py $runtime
        if ($LASTEXITCODE) { throw 'World Architect input fixture failed' }
        if ('${{ inputs.world_authoring_case }}' -eq 'local') {
          python scripts/test-world-architect-ui.py $runtime qa/world/local-ui --local-only
          if ($LASTEXITCODE) { throw 'Prepared World Architect local input failed' }
        }
        if ('${{ inputs.world_authoring_case }}' -in @('remaining','finish')) {
          gh run download $env:PREPARED_RUN --repo $env:GITHUB_REPOSITORY --name compilation-Linux-x64 --dir prepared-fixtures
          if ($LASTEXITCODE) { throw 'Matching portable World fixtures unavailable' }
          $gateFile = Get-ChildItem prepared-fixtures -Recurse -Filter gate-project-1.world.json | Select-Object -First 1
          $moduleFile = Get-ChildItem prepared-fixtures -Recurse -Filter module-pack-1.json | Select-Object -First 1
          if (!$gateFile -or !$moduleFile) { throw 'Missing prepared gate/module fixtures' }
          $gateDir = $gateFile.DirectoryName
          $moduleDir = $moduleFile.DirectoryName
          python scripts/ci-verify-prepared.py --fixtures $gateDir $moduleDir
          if ($LASTEXITCODE) { throw 'Prepared fixture sources differ from current code' }
          if ('${{ inputs.world_authoring_case }}' -eq 'remaining') {
            foreach ($case in @('quality','planning','exterior-light')) {
              python scripts/test-world-architect-ui.py $runtime "qa/world/$case-ui" "--$case-only"
              if ($LASTEXITCODE) { throw "Prepared World Architect $case failed" }
            }
            python scripts/test-world-architect-ui.py $runtime qa/world/gates-ui --gates-only --gate-fixtures $gateDir
            if ($LASTEXITCODE) { throw 'Prepared World Architect gates failed' }
            python scripts/test-world-gates.py $runtime qa/world/gates-applied --applied qa/world/gates-ui --fixture-texture "$runtime/ftebroom/textures/ftebroom/qa_blue.tga"
            if ($LASTEXITCODE) { throw 'Prepared World Architect actual gate BSP failed' }
          }
          python scripts/test-world-architect-ui.py $runtime qa/world/modules-ui --modules-only --module-fixtures $moduleDir
          if ($LASTEXITCODE) { throw 'Prepared World Architect modules failed' }
          if ('${{ inputs.world_authoring_case }}' -eq 'finish') {
            python scripts/test-viewport-create.py $runtime qa/world/create-dark-1280 --theme dark --width 1280 --height 800
            if ($LASTEXITCODE) { throw 'Prepared viewport placement integration failed' }
          }
        }
    - name: Exercise the prepared Plant Editor with OS input
      shell: pwsh
      run: |
        $plantArgs = @()
        if ('${{ inputs.plant_scene_only }}' -eq 'true') {
          python tests/make-linux-build-fixture.py bundle/ReyondBroom-Windows-x64
          if ($LASTEXITCODE) { throw 'FTE source-directory fixture failed' }
          $plantArgs += '--scene-only'
        }
        python scripts/test-plant-ui.py bundle/ReyondBroom-Windows-x64 qa/plants/ui @plantArgs
        if ($LASTEXITCODE) { throw 'Prepared Plant UI acceptance failed' }
        python scripts/test-plant-exports.py qa/plants/ui
        if ($LASTEXITCODE) { throw 'Prepared plant reimport failed' }
        python scripts/test-plant-map.py bundle/ReyondBroom-Windows-x64 qa/plants/ui
        if ($LASTEXITCODE) { throw 'Prepared plant BSP failed' }
      if: inputs.plant_scene_only == 'true' || fromJSON(needs.plan.outputs.plan).flags.plant_ui
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: compilation-Windows-input-reproduction
        path: qa
        retention-days: 7
    needs: plan
  windows-reference:
    if: fromJSON(needs.plan.outputs.plan).mode == 'full' && (github.event_name != 'workflow_dispatch' || inputs.prepared_run_id == '')
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
      GALLIUM_DRIVER: llvmpipe
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare the unmodified official TB reference and test-machine renderer
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force reference, mesa | Out-Null
        gh release download v2026.2 --repo TrenchBroom/TrenchBroom --dir reference --pattern TrenchBroom-Win64-AMD64-v2026.2-Release.zip
        if ($LASTEXITCODE) { throw 'Reference download failed' }
        if ((Get-FileHash reference/TrenchBroom-Win64-AMD64-v2026.2-Release.zip -Algorithm SHA256).Hash.ToLower() -ne 'dd2c5491851275a805110ce465eee3deb45be98e80b00e7b21bb6d250de57fe6') { throw 'Reference checksum mismatch' }
        Expand-Archive reference/TrenchBroom-Win64-AMD64-v2026.2-Release.zip reference/app
        gh release download 25.3.3 --repo pal1000/mesa-dist-win --dir mesa --pattern mesa3d-25.3.3-release-msvc.7z
        if ($LASTEXITCODE) { throw 'Renderer download failed' }
        if ((Get-FileHash mesa/mesa3d-25.3.3-release-msvc.7z -Algorithm SHA256).Hash.ToLower() -ne '66b79057ba273c08daa03551a231995d48b8623bb1efa9f3a7c3e09792d8f1ba') { throw 'Renderer checksum mismatch' }
        & 'C:/Program Files/7-Zip/7z.exe' x mesa/mesa3d-25.3.3-release-msvc.7z '-omesa/extracted' -y
        if ($LASTEXITCODE) { throw 'Renderer extraction failed' }
        Copy-Item mesa/extracted/x64/*.dll reference/app -Force
        python -m pip install Pillow pywinauto
    - name: Capture actual Windows TB controls through OS accessibility/input
      run: python tools/qa/capture-trenchbroom-windows.py reference/app qa/windows-reference
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: compilation-Windows-reference
        path: qa
        retention-days: 7
    needs: plan
  linux:
    if: needs.plan.outputs.runtime == 'true' && (github.event_name != 'workflow_dispatch' || inputs.prepared_run_id == '')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
        - Linux-x64
        - Linux-SDL2-x64
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install build/runtime dependencies
      run: |
        if test -f /etc/apt/apt-mirrors.txt; then
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
        fi
        sudo timeout 180s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20
        sudo timeout 180s apt-get install -y cmake ninja-build build-essential libgl-dev libegl1 libasound2-dev libxss-dev libxrandr-dev libxcursor-dev ffmpeg libx11-dev libpng-dev libjpeg-dev zlib1g-dev xvfb xauth xclip libsdl2-dev ripgrep
    - name: Install UI probe dependencies
      run: python -m pip install python-xlib Pillow
    - name: Verify base runtime and extract build dependencies
      run: |
        mkdir base deps bundle
        gh release download v0.5.0-alpha.134 --repo "$GITHUB_REPOSITORY" --dir base --pattern "*-$PLATFORM.tar.gz" --pattern "*-$PLATFORM.tar.gz.sha256" --pattern '*-Linux-x64-Sources.zip' --pattern '*-Linux-x64-Sources.zip.sha256'
        (cd base && sha256sum -c ./*.sha256)
        tar -xf base/*-$PLATFORM.tar.gz -C bundle
        unzip -q base/*-Sources.zip 'sources/bullet-source.zip' 'sources/fteqw-source.zip' 'sources/imgui-source.zip' -d deps
        for lib in bullet fteqw imgui; do mkdir "deps/$lib"; unzip -q "deps/sources/$lib-source.zip" -d "deps/$lib"; done
    - name: Cache/build bullet
      uses: ./.github/actions/build-dependency
      with:
        component: bullet
        source: deps/bullet
        destination: deps/bullet-build
        platform: ${{ matrix.platform }}
        shell: bash
    - name: Cache/build profile
      uses: ./.github/actions/build-dependency
      with:
        component: profile
        source: native/profile
        destination: deps/profile-core
        platform: ${{ matrix.platform }}
        shell: bash
    - name: Run current profile core tests
      if: fromJSON(needs.plan.outputs.plan).flags.profile_core
      shell: bash
      run: ctest --test-dir deps/profile-core -C Release --output-on-failure
    - name: Build core, upstream corpus, host and CSQC
      run: |
        python tests/check-run-workspace-selection.py
        g++ -std=c++17 -O1 -shared -fPIC -pthread -Ideps/bullet/src -Ideps/fteqw/plugins -Ideps/imgui native/ftebroom.cpp deps/imgui/imgui{,_draw,_tables,_widgets}.cpp deps/profile-core/libreyond-profile.a deps/bullet-build/src/BulletDynamics/libBulletDynamics.a deps/bullet-build/src/BulletCollision/libBulletCollision.a deps/bullet-build/src/LinearMath/libLinearMath.a -lz -ldl -o bundle/ReyondBroom-Linux-x64/fteplug_ftebroom_amd64.so
        make -C deps/fteqw/engine/qclib -j4 R_qcc CC=gcc BASE_CFLAGS=-DQCCONLY BASE_LDFLAGS='-s -lz'
        deps/fteqw/engine/qclib/fteqcc.bin -src qc -srcfile csaddon.src -max_globals 262144 -max_strings 4194304
        cp csaddon.dat bundle/ReyondBroom-Linux-x64/ftebroom/csaddon.dat
        cp runtime/glsl/* bundle/ReyondBroom-Linux-x64/ftebroom/glsl/
        cp deps/profile-core/compilation-profile-probe bundle/ReyondBroom-Linux-x64/tools/
    - name: Build current editor engine
      run: |
        bash scripts/build-editor-engine.sh "$PLATFORM" deps/editor-engine
        engine=deps/editor-engine/engine/release-editor/fteqw-gl64
        if test "$PLATFORM" = Linux-SDL2-x64; then engine=deps/editor-engine/engine/release-sdl2/fteqw-glsdl2_64; fi
        cp "$engine" bundle/ReyondBroom-Linux-x64/fteqw-gl64
        cp "$engine" bundle/ReyondBroom-Linux-x64/tools/runtimes/fteqw-preview64
    - name: Validate plant generators, codecs, materials and all preset LODs
      run: |
        g++ -std=c++17 -O2 tests/plant-editor.cpp -lz -o deps/plant-editor-tests
        deps/plant-editor-tests qa/plants/core
        g++ -std=c++17 -O2 tests/plant-botanical.cpp -lz -o deps/plant-botanical-tests
        git fetch --no-tags --depth=1 origin 9e5b30a57724602b0d1e0f261af742dd68ae571b
        mkdir -p deps/plant-baseline
        git archive 9e5b30a57724602b0d1e0f261af742dd68ae571b native/plant native/ftebroom_bb_math.h native/third_party/json.hpp | tar -x -C deps/plant-baseline
        g++ -std=c++17 -O2 -Ideps/plant-baseline/native tests/plant-legacy-corpus.cpp -lz -o deps/plant-legacy-corpus
        deps/plant-legacy-corpus > qa/plants/legacy-platform.json
        deps/plant-botanical-tests qa/plants/legacy-platform.json qa/plants/botanical-results.json
        python -m pip install trimesh==4.8.3 numpy==2.3.4 Pillow==12.0.0
        python scripts/test-plant-exports.py qa/plants/core
      if: fromJSON(needs.plan.outputs.plan).flags.plant_core
    - name: Materialize selected validation scope
      shell: bash
      env:
        CI_PLAN: ${{ needs.plan.outputs.plan }}
      run: python -c "import os,pathlib; pathlib.Path('ci-plan.json').write_text(os.environ['CI_PLAN'])"
    - name: Check changed audio DSP
      if: fromJSON(needs.plan.outputs.plan).flags.audio_core
      run: scripts/test-audio-core.sh "$PWD/qa/audio-core" /usr/bin/ffmpeg
    - name: Install selected plant import probes
      if: fromJSON(needs.plan.outputs.plan).flags.plant_ui
      run: python -m pip install trimesh==4.8.3 numpy==2.3.4 Pillow==12.0.0
    - name: Check changed grid shaders
      if: fromJSON(needs.plan.outputs.plan).flags.grid
      run: LIBGL_ALWAYS_SOFTWARE=1 python tests/test-grid-lod.py --output qa/grid-lod.json
    - name: Stage current release assets in the source runtime
      run: python scripts/ci-stage-assets.py bundle/ReyondBroom-Linux-x64
    - name: Short native startup of the rebuilt module
      run: xvfb-run -a -s '-screen 0 1280x800x24' python scripts/ci-startup-smoke.py bundle/ReyondBroom-Linux-x64 qa/startup
    - name: Run affected subsystem checks
      shell: bash
      run: |
        python scripts/ci-run-checks.py --plan ci-plan.json --runtime bundle/ReyondBroom-Linux-x64 --output qa/affected --probe deps/profile-core/compilation-profile-probe --platform "$PLATFORM"
    - name: Collect compact affected evidence
      if: always()
      run: |-
        python -c "import os,pathlib; p=pathlib.Path('qa'); p.mkdir(exist_ok=True); (p/'planned-scope.json').write_text(os.environ['CI_PLAN'])"
        python scripts/collect-release-qa.py --qa qa --release unused-release --output qa-artifact
      env:
        CI_PLAN: ${{ needs.plan.outputs.plan }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: compilation-${{ matrix.platform }}
        path: qa-artifact/
        retention-days: 7
    needs: plan
  windows:
    if: needs.plan.outputs.runtime == 'true' && (github.event_name != 'workflow_dispatch' || inputs.prepared_run_id == '')
    runs-on: windows-2022
    env:
      RB_QA_RENDERER: gl rb_qa_opengl.dll
      GALLIUM_DRIVER: llvmpipe
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        update: false
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-zlib mingw-w64-x86_64-pkgconf mingw-w64-x86_64-libpng
          mingw-w64-x86_64-libjpeg-turbo git curl diffutils tar make unzip
    - name: Verify and unpack base runtime and SDK
      shell: msys2 {0}
      run: |
        mkdir base deps bundle
        gh release download v0.5.0-alpha.134 --repo "$GITHUB_REPOSITORY" --dir base --pattern '*-Windows-x64.zip' --pattern '*-Windows-x64.zip.sha256' --pattern '*-Linux-x64-Sources.zip' --pattern '*-Linux-x64-Sources.zip.sha256'
        (cd base && sha256sum -c ./*.sha256)
        unzip -q base/*-Windows-x64.zip -d bundle
        unzip -q base/*-Sources.zip 'sources/bullet-source.zip' 'sources/fteqw-source.zip' 'sources/imgui-source.zip' -d deps
        for lib in bullet fteqw imgui; do mkdir "deps/$lib"; unzip -q "deps/sources/$lib-source.zip" -d "deps/$lib"; done
    - name: Cache/build bullet
      uses: ./.github/actions/build-dependency
      with:
        component: bullet
        source: deps/bullet
        destination: deps/bullet-build
        platform: Windows-x64
        shell: msys2 {0}
    - name: Cache/build profile
      uses: ./.github/actions/build-dependency
      with:
        component: profile
        source: native/profile
        destination: deps/profile-core
        platform: Windows-x64
        shell: msys2 {0}
    - name: Run current profile core tests
      if: fromJSON(needs.plan.outputs.plan).flags.profile_core
      shell: msys2 {0}
      run: ctest --test-dir deps/profile-core -C Release --output-on-failure
    - name: Build MinGW host, core, upstream tests, actual probe and CSQC
      shell: msys2 {0}
      run: |
        python tests/check-run-workspace-selection.py
        g++ -std=c++17 -O1 -shared -static -pthread -Ideps/bullet/src -Ideps/fteqw/plugins -Ideps/imgui native/ftebroom.cpp deps/imgui/imgui{,_draw,_tables,_widgets}.cpp deps/profile-core/libreyond-profile.a deps/bullet-build/lib/libBulletDynamics.a deps/bullet-build/lib/libBulletCollision.a deps/bullet-build/lib/libLinearMath.a -lz -lole32 -lwindowscodecs -lcomdlg32 -lshell32 -lgdi32 -o bundle/ReyondBroom-Windows-x64/fteplug_ftebroom_x64.dll
        make -C deps/fteqw/engine/qclib -j4 R_qcc CC=gcc BASE_CFLAGS=-DQCCONLY BASE_LDFLAGS='-s -lz -Wl,--stack,16777216'
        deps/fteqw/engine/qclib/fteqcc.bin -src qc -srcfile csaddon.src -max_globals 262144 -max_strings 4194304
        cp csaddon.dat bundle/ReyondBroom-Windows-x64/ftebroom/csaddon.dat
        cp runtime/glsl/* bundle/ReyondBroom-Windows-x64/ftebroom/glsl/
        cp deps/profile-core/compilation-profile-probe.exe bundle/ReyondBroom-Windows-x64/tools/
        git rev-parse HEAD > bundle/ReyondBroom-Windows-x64/compilation-editor-revision.txt
    - name: Build the Windows engine with the current editor patch stack
      shell: msys2 {0}
      run: |
        bash scripts/build-editor-engine.sh Windows-x64 deps/editor-engine
        cp deps/editor-engine/engine/release-editor/fteglqw64.exe bundle/ReyondBroom-Windows-x64/bin/fteqw64.exe
    - name: Install a pinned software OpenGL renderer for the headless Windows host
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force mesa | Out-Null
        gh release download 25.3.3 --repo pal1000/mesa-dist-win --dir mesa --pattern mesa3d-25.3.3-release-msvc.7z
        if ($LASTEXITCODE) { throw 'Mesa test renderer download failed' }
        if ((Get-FileHash mesa/mesa3d-25.3.3-release-msvc.7z -Algorithm SHA256).Hash.ToLower() -ne '66b79057ba273c08daa03551a231995d48b8623bb1efa9f3a7c3e09792d8f1ba') { throw 'Mesa checksum mismatch' }
        & 'C:/Program Files/7-Zip/7z.exe' x mesa/mesa3d-25.3.3-release-msvc.7z '-omesa/extracted' -y
        if ($LASTEXITCODE) { throw 'Mesa extraction failed' }
        $gl = Get-ChildItem mesa/extracted -Recurse -Filter opengl32.dll | Where-Object { $_.DirectoryName -match 'x64|amd64' } | Select-Object -First 1
        if (!$gl) { throw '64-bit Mesa OpenGL DLL missing' }
        Copy-Item (Join-Path $gl.DirectoryName '*.dll') bundle/ReyondBroom-Windows-x64/bin -Force
        # FTE deliberately bypasses application-local opengl32.dll. A distinct
        # minidriver name selects the test renderer instead of system GDI 1.1.
        Copy-Item $gl.FullName bundle/ReyondBroom-Windows-x64/bin/rb_qa_opengl.dll -Force
    - name: Install UI screenshot dependency
      shell: pwsh
      run: python -m pip install Pillow pywinauto
    - name: Preserve the built Windows editor for focused UI reproductions
      uses: actions/upload-artifact@v4
      with:
        name: compilation-Windows-editor
        path: |
          bundle/ReyondBroom-Windows-x64/fteplug_ftebroom_x64.dll
          bundle/ReyondBroom-Windows-x64/ftebroom/csaddon.dat
          bundle/ReyondBroom-Windows-x64/tools/compilation-profile-probe.exe
          bundle/ReyondBroom-Windows-x64/bin/fteqw64.exe
          bundle/ReyondBroom-Windows-x64/compilation-editor-revision.txt
        retention-days: 7
      if: github.event_name == 'workflow_dispatch'
    - name: Configure a usable desktop for the UI atlas
      shell: pwsh
      run: |
        if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
          # Hosted Windows rejects 4K and otherwise stays at 1024x768.
          # Match the supported desktop used by packaged-release acceptance.
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
        }
    - name: Validate Windows plant generators, codecs, materials and preset LODs
      shell: msys2 {0}
      run: |
        g++ -std=c++17 -O2 tests/plant-editor.cpp -lz -o deps/plant-editor-tests.exe
        deps/plant-editor-tests.exe qa/plants/core
        g++ -std=c++17 -O2 tests/plant-botanical.cpp -lz -o deps/plant-botanical-tests.exe
        git fetch --no-tags --depth=1 origin 9e5b30a57724602b0d1e0f261af742dd68ae571b
        mkdir -p deps/plant-baseline
        git archive 9e5b30a57724602b0d1e0f261af742dd68ae571b native/plant native/ftebroom_bb_math.h native/third_party/json.hpp | tar -x -C deps/plant-baseline
        g++ -std=c++17 -O2 -Ideps/plant-baseline/native tests/plant-legacy-corpus.cpp -lz -o deps/plant-legacy-corpus.exe
        deps/plant-legacy-corpus.exe > qa/plants/legacy-platform.json
        deps/plant-botanical-tests.exe qa/plants/legacy-platform.json qa/plants/botanical-results.json
      if: fromJSON(needs.plan.outputs.plan).flags.plant_core
    - name: Materialize selected validation scope
      shell: pwsh
      env:
        CI_PLAN: ${{ needs.plan.outputs.plan }}
      run: python -c "import os,pathlib; pathlib.Path('ci-plan.json').write_text(os.environ['CI_PLAN'])"
    - name: Install selected plant import probes
      if: fromJSON(needs.plan.outputs.plan).flags.plant_ui
      run: python -m pip install trimesh==4.8.3 numpy==2.3.4 Pillow==12.0.0
    - name: Fetch current audio build source when affected
      if: fromJSON(needs.plan.outputs.plan).flags.audio_core
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force audio-base,audio-deps | Out-Null
        gh release download v0.5.0-alpha.134 --repo $env:GITHUB_REPOSITORY --dir audio-base --pattern '*-Windows-x64-Sources.zip' --pattern '*-Windows-x64-Sources.zip.sha256'
        if ($LASTEXITCODE) { throw 'Audio source download failed' }
        $archive = (Get-ChildItem audio-base/*-Sources.zip).FullName
        $expected = ((Get-Content audio-base/*-Sources.zip.sha256) -split '\s+')[0]
        if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Audio source checksum mismatch' }
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
        try { [System.IO.Compression.ZipFileExtensions]::ExtractToFile($zip.GetEntry('tools/audio/ffmpeg-8.0.1-source.tar.xz'), "$PWD/audio-deps/ffmpeg-8.0.1.tar.xz", $true) } finally { $zip.Dispose() }
    - name: Cache/build audio
      uses: ./.github/actions/build-dependency
      with:
        component: audio
        source: audio-deps
        destination: .ci-deps/audio
        platform: Windows-x64
        shell: msys2 {0}
      if: fromJSON(needs.plan.outputs.plan).flags.audio_core
    - name: Check changed Windows audio DSP
      if: fromJSON(needs.plan.outputs.plan).flags.audio_core
      shell: msys2 {0}
      run: |
        scripts/test-audio-core.sh "$PWD/qa/audio-core" "$(cygpath -m "$PWD/tools/audio/ffmpeg.exe")"
        cp tools/audio/ffmpeg.exe bundle/ReyondBroom-Windows-x64/tools/audio/ffmpeg.exe
    - name: Reimport changed plant core exports
      if: fromJSON(needs.plan.outputs.plan).flags.plant_core
      run: python scripts/test-plant-exports.py qa/plants/core
    - name: Stage current release assets in the source runtime
      run: python scripts/ci-stage-assets.py bundle/ReyondBroom-Windows-x64
    - name: Short native startup of the rebuilt module
      run: python scripts/ci-startup-smoke.py bundle/ReyondBroom-Windows-x64 qa/startup
    - name: Run affected subsystem checks
      shell: pwsh
      run: |
        python scripts/ci-run-checks.py --plan ci-plan.json --runtime bundle/ReyondBroom-Windows-x64 --output qa/affected --probe deps/profile-core/compilation-profile-probe.exe --platform Windows-x64
        if ($LASTEXITCODE) { throw 'Affected acceptance failed' }
    - name: Collect compact affected evidence
      if: always()
      run: |-
        python -c "import os,pathlib; p=pathlib.Path('qa'); p.mkdir(exist_ok=True); (p/'planned-scope.json').write_text(os.environ['CI_PLAN'])"
        python scripts/collect-release-qa.py --qa qa --release unused-release --output qa-artifact
      env:
        CI_PLAN: ${{ needs.plan.outputs.plan }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: compilation-Windows-x64
        path: qa-artifact/
        retention-days: 7
    needs: plan
