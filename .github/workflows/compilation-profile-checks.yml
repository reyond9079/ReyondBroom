name: Isolated Windows OS input diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RB_QA_RENDERER: gl rb_qa_opengl.dll
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authentic staged runtime and sources
        shell: pwsh
        run: |
          New-Item -Type Directory -Force downloads | Out-Null
          gh release download v0.5.0-alpha.134 --repo $env:GITHUB_REPOSITORY --dir downloads --pattern '*-Windows-x64.zip' --pattern '*-Windows-x64-Sources.zip'
          if ($LASTEXITCODE) { throw 'Staged archives unavailable' }
          python scripts/prepare-windows-os-diagnostic.py
          if ($LASTEXITCODE) { throw 'Authenticity verification failed' }
          python -m pip install Pillow==12.0.0 pywinauto
      - name: Observe single OS clicks and post-failure F24 without product changes
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/test-engine-cleanup.py bundle/ReyondBroom-Windows-x64 diagnostic/cleanup --probe diagnostic/authentic-probe.exe
          $code = $LASTEXITCODE
          @{exit_code=$code; method='Original test assertions retained. Failure triggers read-only OS F24/cvar observations before shutdown; no click is retried.'} | ConvertTo-Json | Set-Content diagnostic/test-exit.json
          exit $code
      - name: Retain compact authentic evidence
        if: always()
        shell: pwsh
        run: |
          python scripts/collect-release-qa.py --qa diagnostic --release downloads --output retained
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-os-input-diagnostic
          path: retained
