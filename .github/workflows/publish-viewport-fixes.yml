name: Publish validated viewport fixes
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-viewport-fixes.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-viewport-fixes
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the merged source, platform checks and twelve release assets
        uses: actions/github-script@v7
        with:
          script: |
            const {createHash} = require('node:crypto');
            const repo = context.repo, version = '0.5.0-alpha.130', tag = 'v' + version;
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {...repo, commit_sha: context.sha});
            const candidate = prs.find(p => p.merged_at && p.merge_commit_sha === context.sha && p.head.ref === 'fix/viewport-grid-shortcuts-profiles');
            if (!candidate) throw new Error('Expected the merged viewport fixes PR');
            const {data: pr} = await github.rest.pulls.get({...repo, pull_number: candidate.number});
            if (!pr.merged || pr.merge_commit_sha !== context.sha) throw new Error('Unexpected merge commit');
            const {data: head} = await github.rest.git.getCommit({...repo, commit_sha: pr.head.sha});
            const {data: merged} = await github.rest.git.getCommit({...repo, commit_sha: context.sha});
            if (head.tree.sha !== merged.tree.sha) throw new Error('Merged source differs from the reviewed/package source');
            const required = ['windows', 'linux (Linux-x64)', 'linux (Linux-SDL2-x64)'];
            const passed = async (workflow_id, title) => {
              const {data} = await github.rest.actions.listWorkflowRuns({...repo, workflow_id,
                head_sha: pr.head.sha, status: 'completed', per_page: 100});
              const run = data.workflow_runs.find(r => r.head_sha === pr.head.sha && r.conclusion === 'success' && (!title || r.display_title.startsWith(title)));
              if (!run) throw new Error(`No successful ${workflow_id} run for ${pr.head.sha}`);
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...repo, run_id: run.id});
              for (const name of required) if (!jobs.some(j => j.name === name && j.conclusion === 'success'))
                throw new Error(`Missing successful platform ${name} in ${run.id}`);
              return run;
            };
            const ci = await passed('compilation-profile-checks.yml');
            const packages = await passed('release-linux-ui-update.yml', `Release ${version} @`);
            const releases = await github.paginate(github.rest.repos.listReleases, {...repo, per_page: 100});
            const release = releases.find(r => r.tag_name === tag);
            if (!release || !release.draft) throw new Error('Expected reserved unpublished alpha.130 draft');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...repo, release_id: release.id});
            if (assets.length !== 12 || assets.some(a => a.state !== 'uploaded' || !a.size))
              throw new Error('Expected twelve complete runtime/source/checksum assets');
            const byName = new Map(assets.map(a => [a.name, a]));
            for (const platform of ['Windows-x64','Linux-x64','Linux-SDL2-x64']) {
              const prefix = `ReyondBroom-${version}-${platform}`;
              for (const name of [prefix + (platform === 'Windows-x64' ? '.zip' : '.tar.gz'), prefix + '-Sources.zip']) {
                const payload = byName.get(name), checksum = byName.get(name + '.sha256');
                if (!payload || !checksum) throw new Error(`Missing ${name}`);
                const response = await fetch(checksum.url, {headers: {Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  Accept: 'application/octet-stream', 'X-GitHub-Api-Version': '2022-11-28'}});
                if (!response.ok) throw new Error(`Cannot read checksum ${name}: ${response.status}`);
                const bytes = Buffer.from(await response.arrayBuffer());
                const match = bytes.toString('utf8').trim().match(/^([a-f0-9]{64})\s+([^\s]+)$/);
                if (!match || match[2] !== name || payload.digest !== 'sha256:' + match[1] ||
                    checksum.digest !== 'sha256:' + createHash('sha256').update(bytes).digest('hex'))
                  throw new Error(`Checksum mismatch for ${name}`);
                core.info(`Verified ${name}`);
              }
            }
            // The draft is unpublished; never retarget an unrelated existing tag.
            let ref;
            try { ref = (await github.rest.git.getRef({...repo, ref: 'tags/' + tag})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (!ref) await github.rest.git.createRef({...repo, ref: 'refs/tags/' + tag, sha: context.sha});
            else if (ref.object.sha !== context.sha) {
              if (ref.object.sha !== pr.head.sha) throw new Error('Draft tag points to an unexpected commit');
              await github.rest.git.updateRef({...repo, ref: 'tags/' + tag, sha: context.sha, force: true});
            }
            const body = [
              'Исправления по отчёту пользователя: сетка, рёбра, фон и команды редактора.', '',
              '- Цвет сетки применяется одинаково в 2D/3D, без скрытого затемнения RGB.',
              '- Сетка в ортографических видах рисуется под рёбрами брашей; кэш сохраняет их чёткость.',
              '- При отключённом фоне неба используется тёмно-серый цвет. Его можно настроить в Colors.',
              '- Горячие клавиши для Create func_detail и Create func_group; поиск команд без учёта регистра, по отдельным словам. Существующий ID и сочетание сброса world-aligned UV сохранены.',
              '- Профили Compile и движки Launch можно переставлять стрелками и сортировать A–Z. Выбранный профиль сохраняется при перестановке, порядок сохраняется на диске.', '',
              `Проверены Windows/native Linux/SDL2: CI https://github.com/${repo.owner}/${repo.repo}/actions/runs/${ci.id}`,
              `Готовые пакеты, Light/Dark и 1920/1024: https://github.com/${repo.owner}/${repo.repo}/actions/runs/${packages.id}`,
              `Исходники пакетов: ${pr.head.sha}; дерево совпадает со слитым коммитом ${context.sha}.`,
              'Отчёт: docs/qa/viewport-fixes/acceptance.md'
            ].join('\n');
            const {data: published} = await github.rest.repos.updateRelease({...repo, release_id: release.id,
              target_commitish: context.sha, body, draft: false, prerelease: false, make_latest: 'true'});
            core.info(`Published ${published.html_url}`);
        env:
          GITHUB_TOKEN: ${{ github.token }}
