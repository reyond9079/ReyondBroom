name: Stage validated alpha.31 packages
run-name: Stage alpha.31 from run 44305873105
'on':
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: d5a903476880d69074e79789135502c28beca72f
      BUILD_HEAD: d5a903476880d69074e79789135502c28beca72f
      CANDIDATE: '44305873105'
      TAG: v0.6.0-alpha.31
    steps:
      - name: Verify successful candidate and draft target
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE" |
            jq -e --arg sha "$BUILD_HEAD" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha == $sha and .conclusion == "success" and
              .head_repository.full_name == $repo and
              .path == ".github/workflows/release-linux-ui-update.yml"
            '
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish |
            jq -e --arg sha "$SOURCE" '.isDraft and .targetCommitish == $sha'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-packages-*
          github-token: ${{ github.token }}
          run-id: '44305873105'
          path: release-packages
      - name: Validate and upload the exact artifacts to the draft
        run: |
          for platform in Windows-x64 Linux-x64 Linux-SDL2-x64; do
            dir="release-packages/release-packages-$platform"
            ext=tar.gz
            if [[ "$platform" == Windows-x64 ]]; then ext=zip; fi
            base="ReyondBroom-${TAG#v}-$platform"
            test "$(find "$dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 4
            for name in "$base.$ext" "$base-Sources.zip"; do
              checksum="$(awk -v expected="$name" '
                NF == 2 && length($1) == 64 && $1 !~ /[^a-f0-9]/ &&
                  ($2 == expected || $2 == ("*" expected)) { print $1 }
              ' "$dir/$name.sha256")"
              test "$(sha256sum "$dir/$name" | cut -d ' ' -f1)" = "$checksum"
            done
          done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release-packages/*/* --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets |
            jq -e '.isDraft and (.assets | length == 12 and all(.state == "uploaded"))'
