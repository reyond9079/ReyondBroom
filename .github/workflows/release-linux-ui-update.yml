name: Extract authenticated Windows cleanup diagnostics
run-name: Windows cleanup diagnostics from run 42570281480 @ ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact original Actions artifact
        run: |
          mkdir diagnostics
          gh api repos/reyond9079/ReyondBroom/actions/artifacts/13652833158 > diagnostics/original-artifact-metadata.json
          gh api repos/reyond9079/ReyondBroom/actions/runs/42570281480 > diagnostics/original-run-metadata.json
          gh api repos/reyond9079/ReyondBroom/actions/jobs/129005841274 > diagnostics/original-job-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata=json.loads(Path('diagnostics/original-artifact-metadata.json').read_text())
          assert metadata['id']==13652833158
          assert metadata['size_in_bytes']==976844089
          assert metadata['digest']=='sha256:d03437686ed388a581e572383ab2f32ad0cd327346f334d36e8b2b4b8b9b2c2f'
          assert not metadata['expired']
          assert metadata['workflow_run']['id']==42570281480
          assert metadata['workflow_run']['head_sha']=='4443a11fb4bd6ddb4d0c6be6a1687b0fdc2150ad'
          PY
          gh api repos/reyond9079/ReyondBroom/actions/artifacts/13652833158/zip > original-artifact.zip
          echo 'd03437686ed388a581e572383ab2f32ad0cd327346f334d36e8b2b4b8b9b2c2f  original-artifact.zip' | sha256sum -c -
          test "$(stat -c %s original-artifact.zip)" = 976844089
      - name: Extract only diagnostic data without executing artifact code
        run: python scripts/extract-engine-cleanup-diagnostics.py original-artifact.zip diagnostics
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cleanup-source-diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
