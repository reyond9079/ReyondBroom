name: Diagnose native Windows input handoff
run-name: Windows input handoff diagnostic @ ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve LF source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: false
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-make
            mingw-w64-x86_64-zlib mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo git make
      - name: Fetch exact authenticated draft runtime and verify original manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force baseline, diagnostics | Out-Null
          gh release download v0.5.0-alpha.134 --repo $env:GITHUB_REPOSITORY --dir baseline --pattern '*-Windows-x64.zip' --pattern '*-Windows-x64.zip.sha256' --pattern '*-Windows-x64-Sources.zip' --pattern '*-Windows-x64-Sources.zip.sha256'
          if ($LASTEXITCODE) { throw 'Draft download failed' }
      - name: Validate payload and pin all unchanged product components
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 4443a11fb4bd6ddb4d0c6be6a1687b0fdc2150ad
          if ($LASTEXITCODE) { throw 'Cannot verify exact original test source commit' }
          python scripts/run-windows-input-diagnostic.py prepare baseline diagnostics
          if ($LASTEXITCODE) { throw 'Exact runtime/test verification failed' }
      - name: Reuse the exact authenticated diagnostic engine and build the console probe
        shell: msys2 {0}
        run: |
          gh api repos/reyond9079/ReyondBroom/actions/artifacts/13654118230 > diagnostics/reused-engine-artifact-metadata.json
          gh api repos/reyond9079/ReyondBroom/actions/artifacts/13654118230/zip > reused-engine.zip
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,zipfile
          expected='e318d80764e563d114e33f072ca5cd753d6bec2d2139cb34fbcdc2a3506b3ffa'
          meta=json.loads(Path('diagnostics/reused-engine-artifact-metadata.json').read_text())
          assert meta['id']==13654118230 and meta['size_in_bytes']==4029100
          assert meta['digest']=='sha256:'+expected
          assert meta['workflow_run']['id']==42573529300
          assert meta['workflow_run']['head_sha']=='5b8fd0f95c9bc4beca852c8ce8c94df278182a99'
          archive=Path('reused-engine.zip');assert archive.stat().st_size==4029100
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected
          selected=['engine-build.log','engine-source-diff.patch','instrumentation-hashes.json','instrumentation-header.h','instrumented-fteglqw64.exe']
          with zipfile.ZipFile(archive) as z:
              for name in selected:Path('diagnostics',name).write_bytes(z.read(name))
          exe=Path('diagnostics/instrumented-fteglqw64.exe')
          assert hashlib.sha256(exe.read_bytes()).hexdigest()=='7c6fa083d6664c2ffe0f65d38f0e7e0878d86605d9cb5ba93a4a9b204d5df693'
          target=Path('engine-diagnostic/engine/release-diagnostic/fteglqw64.exe');target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(exe,target)
          Path('diagnostics/reused-engine-proof.json').write_text(json.dumps({'artifact_id':13654118230,'artifact_bytes':4029100,'artifact_sha256':expected,'engine_sha256':hashlib.sha256(exe.read_bytes()).hexdigest(),'original_build_run':42573529300,'original_build_head':'5b8fd0f95c9bc4beca852c8ce8c94df278182a99','reason':'Previous diagnostic job built the engine successfully then failed linking its standalone wmain probe; preserve that exact engine and source evidence without rebuilding.'},indent=2))
          PY
          g++ -std=c++17 -O2 -static -municode tests/compilation-profile-probe.cpp -o diagnostics/compilation-profile-probe.exe
      - name: Install verified renderer and desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mesa | Out-Null
          gh release download 25.3.3 --repo pal1000/mesa-dist-win --dir mesa --pattern mesa3d-25.3.3-release-msvc.7z
          if ($LASTEXITCODE) { throw 'Mesa download failed' }
          if ((Get-FileHash mesa/mesa3d-25.3.3-release-msvc.7z -Algorithm SHA256).Hash.ToLower() -ne '66b79057ba273c08daa03551a231995d48b8623bb1efa9f3a7c3e09792d8f1ba') { throw 'Mesa checksum mismatch' }
          & 'C:/Program Files/7-Zip/7z.exe' x mesa/mesa3d-25.3.3-release-msvc.7z '-omesa/extracted' -y
          if ($LASTEXITCODE) { throw 'Mesa extraction failed' }
          Copy-Item mesa/extracted/x64/*.dll baseline/ReyondBroom-Windows-x64/bin -Force
          Copy-Item mesa/extracted/x64/opengl32.dll baseline/ReyondBroom-Windows-x64/bin/rb_qa_opengl.dll -Force
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) { Set-DisplayResolution -Width 1920 -Height 1080 -Force }
      - name: Exercise unchanged cleanup script with native OS input
        shell: pwsh
        env:
          RB_QA_RENDERER: gl rb_qa_opengl.dll
          GALLIUM_DRIVER: llvmpipe
        run: |
          python -m pip install Pillow pywinauto
          python scripts/run-windows-input-diagnostic.py run-cleanup baseline diagnostics
          if ($LASTEXITCODE) { throw 'Diagnostic driver infrastructure failed' }
      - name: Collect raw traces without changing test results
        if: always()
        shell: pwsh
        run: |
          python scripts/run-windows-input-diagnostic.py collect baseline diagnostics
          if ($LASTEXITCODE) { throw 'Diagnostic collection failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-input-instrumented-cleanup
          path: diagnostics/compact/
          if-no-files-found: error
          retention-days: 7
      - name: Exercise unchanged viewport script with native OS input
        shell: pwsh
        env:
          RB_QA_RENDERER: gl rb_qa_opengl.dll
          GALLIUM_DRIVER: llvmpipe
        run: |
          python scripts/run-windows-input-diagnostic.py run-viewport baseline diagnostics
          if ($LASTEXITCODE) { throw 'Viewport diagnostic infrastructure failed' }
          python scripts/run-windows-input-diagnostic.py collect baseline diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-input-instrumented-all
          path: diagnostics/compact/
          if-no-files-found: error
          retention-days: 7
