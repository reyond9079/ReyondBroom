# Keep the existing workflow filename so it can be dispatched from a fix branch.
name: Release native editor update
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v; draft release must already exist
        required: true
        default: '0.5.0-alpha.126'
      base_tag:
        description: Compatible engine/dependency base for Windows and SDL2
        required: true
        default: 'v0.5.0-alpha.124'
      linux_base_tag:
        description: Native Linux base
        required: true
        default: 'v0.5.0-alpha.125'
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux-x64, Linux-SDL2-x64]
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      PLATFORM: ${{ matrix.platform }}
      BASE_TAG: ${{ matrix.platform == 'Linux-x64' && inputs.linux_base_tag || inputs.base_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and validation tools
        run: |
          if ! command -v ffmpeg || ! command -v rg || ! command -v Xvfb || ! test -f /usr/include/X11/Xlib.h || ! test -f /usr/include/SDL2/SDL.h || ! test -f /usr/include/png.h || ! test -f /usr/include/GL/gl.h; then
            if test -f /etc/apt/apt-mirrors.txt; then
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
            fi
            sudo timeout 180s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20
            sudo timeout 180s apt-get install -y build-essential cmake libgl-dev libx11-dev libpng-dev libjpeg-dev zlib1g-dev xvfb xauth ffmpeg libsdl2-dev ripgrep
          fi
      - name: Fetch and verify compatible runtime and complete sources
        run: |
          mkdir base deps
          gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" --dir base --pattern "*-$PLATFORM.tar.gz" --pattern "*-$PLATFORM.tar.gz.sha256" --pattern "*-$PLATFORM-Sources.zip" --pattern "*-$PLATFORM-Sources.zip.sha256"
          (cd base && sha256sum -c ./*.sha256)
          unzip -q base/*-Sources.zip 'sources/bullet-source.zip' 'sources/fteqw-source.zip' 'sources/imgui-source.zip' -d deps
          for lib in bullet fteqw imgui; do mkdir "deps/$lib"; unzip -q "deps/sources/$lib-source.zip" -d "deps/$lib"; done
      - name: Build compatibility core and CSQC
        run: |
          python scripts/build-profile-support.py core --build-dir deps/profile-core --tests
          make -C deps/fteqw/engine/qclib -j4 R_qcc CC=gcc BASE_CFLAGS=-DQCCONLY BASE_LDFLAGS='-s -lz'
          deps/fteqw/engine/qclib/fteqcc.bin -src qc -srcfile csaddon.src -max_globals 262144 -max_strings 4194304
      - name: Rebuild the SDL2 engine with the editor close guard
        if: matrix.platform == 'Linux-SDL2-x64'
        run: bash scripts/build-sdl2-engine.sh deps/sdl-engine
      - name: Build and test the native module and profile importer
        run: |
          cmake -S deps/bullet -B deps/bullet-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF -DBUILD_BULLET2_DEMOS=OFF -DBUILD_OPENGL3_DEMOS=OFF -DBUILD_CPU_DEMOS=OFF -DBUILD_UNIT_TESTS=OFF -DBUILD_EXTRAS=OFF -DBUILD_BULLET3=OFF -DINSTALL_LIBS=OFF
          cmake --build deps/bullet-build -j2 --target BulletDynamics BulletCollision LinearMath
          g++ -std=c++17 -O2 -shared -fPIC -pthread -Ideps/bullet/src -Ideps/fteqw/plugins -Ideps/imgui native/ftebroom.cpp deps/imgui/imgui{,_draw,_tables,_widgets}.cpp deps/profile-core/libreyond-profile.a deps/bullet-build/src/BulletDynamics/libBulletDynamics.a deps/bullet-build/src/BulletCollision/libBulletCollision.a deps/bullet-build/src/LinearMath/libLinearMath.a -lz -ldl -o deps/fteplug_ftebroom_amd64.so
          scripts/test-audio-core.sh "$PWD/audio-qa" /usr/bin/ffmpeg
      - name: Package native runtime and corresponding sources
        run: |
          engine_args=()
          if test "$PLATFORM" = Linux-SDL2-x64; then engine_args=(--engine deps/sdl-engine/engine/release-sdl2/fteqw-glsdl2_64 --engine-source deps/sdl-engine); fi
          python scripts/package-native-update.py --platform "$PLATFORM" --base-runtime base/*-$PLATFORM.tar.gz --base-sources base/*-Sources.zip --module deps/fteplug_ftebroom_amd64.so --csprogs csaddon.dat "${engine_args[@]}" --version "$VERSION" --output out/release
          (cd out/release && sha256sum -c ./*.sha256)
      - name: Validate the packaged editor
        run: |
          bundle="$PWD/out/release/ReyondBroom-Linux-x64"
          xvfb-run -a -s '-screen 0 1920x1080x24' scripts/test-trenchbroom-linux.sh "$bundle" "$PWD/qa/profiles"
          xvfb-run -a -s '-screen 0 1920x1080x24' scripts/test-audio-editor-linux.sh "$bundle" "$PWD/qa/audio"
          xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/test-audio-archive.py "$bundle" "$PWD/qa/audio-archive"
          python -m pip install python-xlib Pillow
          xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/test-engine-viewport.py "$bundle" "$PWD/qa/engine-viewport" --probe "$PWD/deps/profile-core/compilation-profile-probe"
      - name: Validate packaged Create / Save in both themes and window sizes
        run: |
          bundle="$PWD/out/release/ReyondBroom-Linux-x64"
          python tests/make-linux-build-fixture.py "$bundle"
          for theme in dark light; do
            for dimensions in '1920 1080' '1024 768'; do
              read -r width height <<< "$dimensions"
              xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/test-viewport-create.py "$bundle" "$PWD/qa/viewport-create-$theme-$width" --theme "$theme" --width "$width" --height "$height"
            done
          done
      - name: Capture the complete native botanical catalogue and reference views
        if: matrix.platform == 'Linux-x64'
        run: |
          bundle="$PWD/out/release/ReyondBroom-Linux-x64"
          RB_QA_BUILD="packaged-$VERSION" xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/capture-plant-catalog.py "$bundle" "$PWD/qa/catalog-originals" --extended
          python scripts/plant-contact-sheets.py qa/catalog-originals qa/catalog-sheets
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'Linux-x64' && always()
        with:
          name: REYON-9-contact-sheets
          path: |
            qa/catalog-sheets/**
            qa/catalog-originals/*.json
            qa/catalog-originals/editor.log
      - name: Upload validated packages to the draft release
        run: |
          test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = true
          gh release upload "v$VERSION" out/release/*.tar.gz out/release/*.zip out/release/*.sha256 --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.platform }}
          path: |
            qa/**/*.log
            qa/**/*.png
            qa/**/*.json
            qa/**/*.map
  windows:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      BASE_TAG: ${{ inputs.base_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: false
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkgconf git curl diffutils tar make
      - name: Fetch and verify runtime, converter source and native dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force base, sdk, deps, audio-deps | Out-Null
          gh release download $env:BASE_TAG --repo $env:GITHUB_REPOSITORY --dir base --pattern '*-Windows-x64.zip' --pattern '*-Windows-x64.zip.sha256' --pattern '*-Windows-x64-Sources.zip' --pattern '*-Windows-x64-Sources.zip.sha256'
          if ($LASTEXITCODE -ne 0) { throw 'Base runtime download failed' }
          gh release download $env:BASE_TAG --repo $env:GITHUB_REPOSITORY --dir sdk --pattern '*-Linux-x64-Sources.zip' --pattern '*-Linux-x64-Sources.zip.sha256'
          if ($LASTEXITCODE -ne 0) { throw 'SDK download failed' }
          foreach ($checksum in Get-ChildItem base/*.sha256,sdk/*.sha256) {
            $parts = (Get-Content $checksum.FullName) -split '\s+'
            $file = Join-Path $checksum.DirectoryName $parts[1]
            if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLower() -ne $parts[0]) { throw "Checksum mismatch: $file" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = (Get-ChildItem base/*-Sources.zip).FullName
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try { [System.IO.Compression.ZipFileExtensions]::ExtractToFile($zip.GetEntry('tools/audio/ffmpeg-8.0.1-source.tar.xz'), "$PWD/audio-deps/ffmpeg-8.0.1.tar.xz", $true) } finally { $zip.Dispose() }
          Expand-Archive (Get-ChildItem sdk/*-Sources.zip).FullName deps/base
          foreach ($name in @('bullet','fteqw','imgui')) { Expand-Archive "deps/base/sources/$name-source.zip" "deps/$name" }
      - name: Rebuild and test the complete audio helper
        shell: msys2 {0}
        run: |
          scripts/build-audio.sh "$PWD/audio-deps"
          scripts/test-audio-core.sh "$PWD/audio-qa" "$(cygpath -m "$PWD/tools/audio/ffmpeg.exe")"
      - name: Build native editor and test the profile importer
        shell: msys2 {0}
        run: |
          cmake -S deps/bullet -B deps/bullet-build -G 'MinGW Makefiles' -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_BULLET2_DEMOS=OFF -DBUILD_OPENGL3_DEMOS=OFF -DBUILD_CPU_DEMOS=OFF -DBUILD_UNIT_TESTS=OFF -DBUILD_EXTRAS=OFF -DBUILD_BULLET3=OFF -DINSTALL_LIBS=OFF
          cmake --build deps/bullet-build -j4 --target BulletDynamics BulletCollision LinearMath
          python scripts/build-profile-support.py core --build-dir deps/profile-core --tests --generator 'MinGW Makefiles'
          make -C deps/fteqw/engine/qclib -j4 R_qcc CC=gcc BASE_CFLAGS=-DQCCONLY BASE_LDFLAGS='-s -lz -Wl,--stack,16777216'
          deps/fteqw/engine/qclib/fteqcc.bin -src qc -srcfile csaddon.src -max_globals 262144 -max_strings 4194304
          g++ -std=c++17 -O1 -shared -static -pthread -Ideps/bullet/src -Ideps/fteqw/plugins -Ideps/imgui native/ftebroom.cpp deps/imgui/imgui{,_draw,_tables,_widgets}.cpp deps/profile-core/libreyond-profile.a deps/bullet-build/lib/libBulletDynamics.a deps/bullet-build/lib/libBulletCollision.a deps/bullet-build/lib/libLinearMath.a -lz -lole32 -lwindowscodecs -lcomdlg32 -lshell32 -lgdi32 -o audio-qa/fteplug_ftebroom_x64.dll
      - name: Package runtime and complete corresponding sources
        shell: msys2 {0}
        run: |
          python scripts/package-native-update.py --platform Windows-x64 --base-runtime base/*-Windows-x64.zip --base-sources base/*-Sources.zip --module audio-qa/fteplug_ftebroom_x64.dll --csprogs csaddon.dat --audio-dir tools/audio --version "$VERSION" --output out/release
          (cd out/release && sha256sum -c ./*.sha256)
      - name: Validate PK3 import and the inner audio window in the packaged editor
        shell: pwsh
        run: |
          ./scripts/test-audio-archive-windows.ps1 -Runtime out/release/ReyondBroom-Windows-x64 -Output qa/audio-archive
          python -m pip install Pillow pywinauto
          python scripts/test-engine-viewport.py out/release/ReyondBroom-Windows-x64 qa/engine-viewport --probe deps/profile-core/compilation-profile-probe.exe
          if ($LASTEXITCODE) { throw 'Windows engine/viewport acceptance failed' }
      - name: Validate packaged Create / Save in both themes and window sizes
        shell: pwsh
        run: |
          python tests/make-linux-build-fixture.py out/release/ReyondBroom-Windows-x64
          foreach ($theme in @('dark','light')) {
            foreach ($width in @(1920,1024)) {
              $height = if ($width -eq 1920) { 1080 } else { 768 }
              python scripts/test-viewport-create.py out/release/ReyondBroom-Windows-x64 "qa/viewport-create-$theme-$width" --theme $theme --width $width --height $height
              if ($LASTEXITCODE) { throw "Packaged viewport acceptance failed: $theme $width" }
            }
          }
      - name: Upload validated packages to the draft release
        shell: pwsh
        run: |
          if ((gh release view "v$env:VERSION" --json isDraft --jq .isDraft) -ne 'true') { throw 'Release must remain draft until all platforms pass' }
          gh release upload "v$env:VERSION" out/release/*.zip out/release/*.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-Windows-x64
          path: |
            qa/audio-archive/**
            qa/viewport-create-*/**
            audio-deps/ffmpeg-8.0.1/ffbuild/config.log
            audio-deps/lame-source/config.log
