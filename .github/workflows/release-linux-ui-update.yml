# Keep the existing workflow filename so it can be dispatched from a fix branch.
name: RB-133 immutable Windows QA continuation
run-name: Windows QA continuation ${{ inputs.version }} source c77680c @ ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v; draft release must already exist
        required: true
        default: '0.5.0-alpha.126'
      base_tag:
        description: Compatible engine/dependency base for Windows and SDL2
        required: true
        default: 'v0.5.0-alpha.124'
      capture_catalog:
        description: Capture the complete plant catalogue when plant visuals change
        type: boolean
        default: true
      viewport_checks:
        description: Validate viewport color, shortcuts and ordering fixes in all theme / size cases
        type: boolean
        default: false
      rb10_checks:
        description: Validate every RB-10 UI, native target and updater requirement
        type: boolean
        default: false
      linux_base_tag:
        description: Native Linux base
        required: true
        default: 'v0.5.0-alpha.125'
permissions:
  contents: write
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      RB_QA_RENDERER: gl rb_qa_opengl.dll
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c77680c7f0d78118c6aa69cc9edd63bfcab40e68
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Load immutable reviewed QA harness while keeping product checkout unchanged
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'Fetching exact QA harness failed' }
          New-Item -ItemType Directory -Force .qa-tools | Out-Null
          foreach ($pair in @(@('scripts/editor_os_input.py','scripts/editor_os_input.py'),@('scripts/continue-windows133-qa.py','.qa-tools/continue-windows133-qa.py'))) {
            $source = git show "$($env:GITHUB_SHA):$($pair[0])"
            if ($LASTEXITCODE) { throw 'Reading exact QA harness failed' }
            [System.IO.File]::WriteAllText((Join-Path $PWD $pair[1]), (($source -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
          }
      - name: Verify original product archives and retain only completed prior checks
        shell: pwsh
        run: |
          python .qa-tools/continue-windows133-qa.py
          if ($LASTEXITCODE) { throw 'Immutable SDK / successful evidence verification failed' }
          New-Item -ItemType Directory -Force qa/harness | Out-Null
          Copy-Item scripts/editor_os_input.py qa/harness/editor-os-input.txt
          @{ source = 'c77680c7f0d78118c6aa69cc9edd63bfcab40e68'; workflow = $env:GITHUB_SHA; harness_sha256 = (Get-FileHash scripts/editor_os_input.py -Algorithm SHA256).Hash.ToLower(); method = 'Single OS-queued V tap; modifiers held over observed ticks; product archives reused unchanged; original assertions.' } | ConvertTo-Json | Set-Content -Encoding utf8 qa/harness/provenance.json
      - name: Build the actual standalone process argument probe
        shell: msys2 {0}
        run: |
          mkdir -p deps/profile-core
          g++ -std=c++17 -O2 -static -pthread -municode tests/compilation-profile-probe.cpp -o deps/profile-core/compilation-profile-probe.exe
      - name: Prepare the same verified software renderer for actual OS input
        shell: pwsh
        run: |
          python -m pip install Pillow pywinauto
          if ($LASTEXITCODE) { throw 'OS input dependencies failed' }
          $runtime = (Resolve-Path out/release/ReyondBroom-Windows-x64).Path
          $mesa = Join-Path $env:RUNNER_TEMP 'reyond-audio-mesa'
          New-Item -ItemType Directory -Force $mesa | Out-Null
          gh release download 25.3.3 --repo pal1000/mesa-dist-win --dir $mesa --pattern mesa3d-25.3.3-release-msvc.7z --clobber
          if ($LASTEXITCODE) { throw 'Mesa test renderer download failed' }
          $archive = Join-Path $mesa 'mesa3d-25.3.3-release-msvc.7z'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '66b79057ba273c08daa03551a231995d48b8623bb1efa9f3a7c3e09792d8f1ba') { throw 'Mesa checksum mismatch' }
          & 'C:/Program Files/7-Zip/7z.exe' x $archive "-o$mesa/extracted" -y | Out-Null
          if ($LASTEXITCODE) { throw 'Mesa extraction failed' }
          $gl = Get-ChildItem "$mesa/extracted" -Recurse -Filter opengl32.dll | Where-Object { $_.DirectoryName -match 'x64|amd64' } | Select-Object -First 1
          if (!$gl) { throw '64-bit Mesa DLL missing' }
          Copy-Item (Join-Path $gl.DirectoryName '*.dll') "$runtime/bin" -Force
          Copy-Item $gl.FullName "$runtime/bin/rb_qa_opengl.dll" -Force
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) { Set-DisplayResolution -Width 1920 -Height 1080 -Force }
      - name: Validate the failed and unexecuted appearance cases with single-tap paste
        shell: pwsh
        run: |
          python tests/make-linux-build-fixture.py out/release/ReyondBroom-Windows-x64
          if ($LASTEXITCODE) { throw 'Appearance fixture failed' }
          foreach ($case in @(@('light',1920),@('dark',1024),@('dark',1920))) {
            $theme = $case[0]; $width = $case[1]
            $height = if ($width -eq 1920) { 1080 } else { 768 }
            python scripts/test-viewport-appearance.py out/release/ReyondBroom-Windows-x64 "qa/appearance-$theme-$width" --theme $theme --width $width --height $height
            if ($LASTEXITCODE) { throw "Appearance acceptance failed: $theme / $width" }
          }
      - name: Validate packaged Create / Save in both themes and window sizes
        shell: pwsh
        run: |
          $env:RB_QA_RENDERER = 'gl rb_qa_opengl.dll'
          python tests/make-linux-build-fixture.py out/release/ReyondBroom-Windows-x64
          foreach ($theme in @('dark','light')) {
            foreach ($width in @(1920,1024)) {
              $height = if ($width -eq 1920) { 1080 } else { 768 }
              python scripts/test-viewport-create.py out/release/ReyondBroom-Windows-x64 "qa/viewport-create-$theme-$width" --theme $theme --width $width --height $height
              if ($LASTEXITCODE) { throw "Packaged viewport acceptance failed: $theme $width" }
            }
          }
      - name: Validate packaged RB-10 workflows on Windows and PowerShell 5.1
        if: inputs.rb10_checks
        shell: pwsh
        env:
          RB_QA_RENDERER: gl rb_qa_opengl.dll
          GALLIUM_DRIVER: llvmpipe
        run: |
          $bundle = (Resolve-Path out/release/ReyondBroom-Windows-x64).Path
          python tests/make-linux-build-fixture.py $bundle
          if ($LASTEXITCODE) { throw 'RB-10 fixture failed' }
          python scripts/test-editor133-input.py $bundle qa/rb10/editor133-input
          if ($LASTEXITCODE) { throw 'Viewport input / clean onboarding acceptance failed' }
          python tests/test-welcome-updater.py --platform Windows-x64 --output qa/rb10/updater --runtime $bundle
          if ($LASTEXITCODE) { throw 'Windows PowerShell updater protocol failed' }
          python scripts/test-rb10-runtime.py $bundle qa/rb10/runtime
          if ($LASTEXITCODE) { throw 'Native RB-10 regression failed' }
          python scripts/test-rb10-browsers.py $bundle qa/rb10/browsers
          if ($LASTEXITCODE) { throw 'Browser acceptance failed' }
          python scripts/test-rb10-welcome.py $bundle qa/rb10/welcome
          if ($LASTEXITCODE) { throw 'Welcome acceptance failed' }
          python scripts/test-quake2-resources.py $bundle qa/rb10/quake2
          if ($LASTEXITCODE) { throw 'Quake II custom-mod resources acceptance failed' }
          python scripts/test-engine-cleanup.py $bundle qa/rb10/engine-cleanup --probe deps/profile-core/compilation-profile-probe.exe
          if ($LASTEXITCODE) { throw 'Quake engine copy/cleanup launch acceptance failed' }
          python scripts/test-compilation-paths.py $bundle qa/rb10/compilation-paths --probe deps/profile-core/compilation-profile-probe.exe
          if ($LASTEXITCODE) { throw 'TrenchBroom compilation source/working-path acceptance failed' }
          python scripts/test-plant-target-ui.py $bundle qa/rb10/plant-target-ui
          if ($LASTEXITCODE) { throw 'Plant native target acceptance failed' }
          foreach ($theme in @('dark','light')) {
            foreach ($width in @(1920,1024)) {
              $height = if ($width -eq 1920) { 1080 } else { 768 }
              python scripts/test-rb10-views.py $bundle "qa/rb10/views-$theme-$width" --theme $theme --width $width --height $height
              if ($LASTEXITCODE) { throw "View Options/Tools acceptance failed: $theme / $width" }
            }
          }
      - name: Collect byte-preserved prior evidence and new acceptance results
        if: always()
        shell: pwsh
        run: |
          python scripts/collect-release-qa.py --qa qa --release out/release --output qa-artifact
          if ($LASTEXITCODE) { throw 'Collecting release evidence failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-Windows-x64
          path: qa-artifact/
          if-no-files-found: error
