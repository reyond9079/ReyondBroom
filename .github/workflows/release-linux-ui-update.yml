name: Verify authentic staged Windows 134 package
run-name: Staged Windows 134 acceptance with portable019 QA @ ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
      RB_QA_RENDERER: gl rb_qa_opengl.dll
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and authenticate immutable staged5d runtime and complete sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force baseline, qa/provenance | Out-Null
          git fetch --no-tags --depth=1 origin 5d554d77b9a274133235d785a63ce9540d056844 019d9ca1c27c11ec89882141fccfbba0cdff0f80
          if ($LASTEXITCODE) { throw 'Cannot verify canonical source revisions' }
          gh release download v0.5.0-alpha.134 --repo $env:GITHUB_REPOSITORY --dir baseline --pattern '*-Windows-x64.zip' --pattern '*-Windows-x64.zip.sha256' --pattern '*-Windows-x64-Sources.zip' --pattern '*-Windows-x64-Sources.zip.sha256'
          if ($LASTEXITCODE) { throw 'Staged runtime download failed' }
          python scripts/verify-staged-windows-134.py
          if ($LASTEXITCODE) { throw 'Complete runtime/source verification failed' }
      - name: Fetch authenticated canonical process probe
        shell: pwsh
        run: |
          gh api repos/reyond9079/ReyondBroom/actions/artifacts/13652832603 > qa/provenance/probe-artifact-metadata.json
          if ($LASTEXITCODE) { throw 'Probe metadata download failed' }
          gh api repos/reyond9079/ReyondBroom/actions/artifacts/13652832603/zip > canonical-probe.zip
          if ($LASTEXITCODE) { throw 'Probe archive download failed' }
          python scripts/fetch-canonical-windows-probe.py
          if ($LASTEXITCODE) { throw 'Canonical probe verification failed' }
      - name: Prepare verified software renderer and desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mesa | Out-Null
          gh release download 25.3.3 --repo pal1000/mesa-dist-win --dir mesa --pattern mesa3d-25.3.3-release-msvc.7z
          if ($LASTEXITCODE) { throw 'Mesa download failed' }
          if ((Get-FileHash mesa/mesa3d-25.3.3-release-msvc.7z -Algorithm SHA256).Hash.ToLower() -ne '66b79057ba273c08daa03551a231995d48b8623bb1efa9f3a7c3e09792d8f1ba') { throw 'Mesa checksum mismatch' }
          & 'C:/Program Files/7-Zip/7z.exe' x mesa/mesa3d-25.3.3-release-msvc.7z '-omesa/extracted' -y
          if ($LASTEXITCODE) { throw 'Mesa extraction failed' }
          Copy-Item mesa/extracted/x64/*.dll baseline/ReyondBroom-Windows-x64/bin -Force
          Copy-Item mesa/extracted/x64/opengl32.dll baseline/ReyondBroom-Windows-x64/bin/rb_qa_opengl.dll -Force
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) { Set-DisplayResolution -Width 1920 -Height 1080 -Force }
          python -m pip install Pillow pywinauto
          if ($LASTEXITCODE) { throw 'UI dependencies failed' }
      - name: Validate all32 real mod lighting and deployment checks
        shell: pwsh
        run: |
          python scripts/test-mod-profile-lighting.py baseline/ReyondBroom-Windows-x64 qa/mod-profiles/end-to-end --probe canonical-probe.exe
          if ($LASTEXITCODE) { throw 'Real mod/profile/lighting acceptance failed' }
      - name: Preserve immediate authentic mod32 evidence
        if: always()
        shell: pwsh
        run: |
          python scripts/collect-release-qa.py --qa qa --release baseline --output compact-mod
          if ($LASTEXITCODE) { throw 'Mod evidence collection failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staged-Windows-134-mod32
          path: compact-mod/
          if-no-files-found: error
          retention-days: 7
      - name: Validate Create and Save in four theme and size cases
        shell: pwsh
        run: |
          python tests/make-linux-build-fixture.py baseline/ReyondBroom-Windows-x64
          if ($LASTEXITCODE) { throw 'Create fixture failed' }
          foreach ($theme in @('dark','light')) {
            foreach ($width in @(1920,1024)) {
              $height = if ($width -eq 1920) { 1080 } else { 768 }
              python scripts/test-viewport-create.py baseline/ReyondBroom-Windows-x64 "qa/viewport-create-$theme-$width" --theme $theme --width $width --height $height
              if ($LASTEXITCODE) { throw "Create acceptance failed: $theme $width" }
            }
          }
      - name: Validate appearance in four theme and size cases
        shell: pwsh
        run: |
          foreach ($theme in @('dark','light')) {
            foreach ($width in @(1920,1024)) {
              $height = if ($width -eq 1920) { 1080 } else { 768 }
              python scripts/test-viewport-appearance.py baseline/ReyondBroom-Windows-x64 "qa/appearance-$theme-$width" --theme $theme --width $width --height $height
              if ($LASTEXITCODE) { throw "Appearance acceptance failed: $theme $width" }
            }
          }
      - name: Preserve complete acceptance evidence
        if: always()
        shell: pwsh
        run: |
          python scripts/collect-release-qa.py --qa qa --release baseline --output compact-all
          if ($LASTEXITCODE) { throw 'Complete evidence collection failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staged-Windows-134-full
          path: compact-all/
          if-no-files-found: error
          retention-days: 7
