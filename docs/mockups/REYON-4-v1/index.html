<script>
const params=new URLSearchParams(location.search);let state=params.get('state')||'basic';
const paths={audio:'M9 18V5l10-2v13M9 8l10-2M6 21c2 0 3-1 3-3s-4-2-5 0 0 3 2 3m10-2c2 0 3-1 3-3s-4-2-5 0 0 3 2 3',folder:'M3 7V5h6l2 2h10v13H3z',search:'M20 20l-5-5M10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14',plus:'M12 5v14M5 12h14',chevron:'m7 10 5 5 5-5',menu:'M4 6h16M4 12h16M4 18h16',close:'m6 6 12 12M6 18 18 6',up:'M12 16V3m-5 5 5-5 5 5M4 14v7h16v-7',select:'M5 3v17l5-5 4 7 3-2-4-7h7z',undo:'m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12',redo:'m16 4 5 5-5 5m5-5H10a6 6 0 0 0 0 12',split:'M8 3v18M16 3v18M4 12h16',left:'M9 4v16M4 4h2M4 20h2M13 7l5 5-5 5',right:'M15 4v16M18 4h2M18 20h2m-7-13-5 5 5 5',trash:'M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7',mic:'M8 5a4 4 0 0 1 8 0v7a4 4 0 0 1-8 0V5m-3 6v1a7 7 0 0 0 14 0v-1M12 19v3m-4 0h8',magnet:'M5 10V5h5v9a2 2 0 0 0 4 0V5h5v9a7 7 0 0 1-14 0v-4M5 9h5m4 0h5',snap:'M12 3v18M3 8h5l-3 4 3 4H3m18-8h-5l3 4-3 4h5',link:'m10 7 3-3a5 5 0 0 1 7 7l-3 3m-3 3-3 3a5 5 0 0 1-7-7l3-3m1 6 8-8',axis:'M12 3v18M4 6h4v12H4M20 6h-4v12h4',fit:'M3 7V3h4m10 0h4v4M3 17v4h4m10 0h4v-4M7 7h10v10H7z',minus:'M5 12h14',lock:'M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5zM12 14v3',speaker:'M4 9h4l5-5v16l-5-5H4zM17 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14',mute:'M4 9h4l5-5v16l-5-5H4zm13 0 5 6m0-6-5 6',play:'m8 4 12 8-12 8z',stop:'M6 6h12v12H6z',back:'M5 4v16m14-16L8 12l11 8z',key:'M3 6h18v12H3zM6 9h1m3 0h1m3 0h1m3 0h1M6 12h1m3 0h1m3 0h1m3 0h1M7 15h10',diamond:'m12 3 9 9-9 9-9-9z',reset:'M4 4v6h6M4 10a8 8 0 1 1 0 5',grid:'M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z',more:'M4 12h1m6 0h1m6 0h1',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7m7 0a3 3 0 1 0 6 0 3 3 0 0 0-6 0',flag:'M5 22V3h13l-3 5 3 5H5',wave:'M3 9v6m4-9v12m5-16v20m5-16v12m4-9v6'};

const btn=(id,n,title,active=false,view='')=>`<button data-action="${id}" title="${title}" aria-label="${title}" class="${active?'active':''}" ${view?`data-view="${view}"`:''}>${icon(n)}</button>`;
function wave(seed=1,width=700){let p='';for(let i=0;i<width;i+=4){let env=.18+.72*Math.abs(Math.sin(i*.017+seed)*Math.cos(i*.006+seed));let amp=(4+33*env)*(.3+.7*Math.abs(Math.sin(i*1.73+seed)));p+=`M${i},${45-amp}v${amp*2} `}return `<svg class="wave" viewBox="0 0 ${width} 90" preserveAspectRatio="none" aria-label="Illustrative waveform"><path d="${p}" fill="none" stroke="currentColor" stroke-width="2"/></svg>`}

const toggle=(on=false)=>`<span class="toggle ${on?'on':''}"></span>`;
const check=(on=false)=>`<span class="check ${on?'on':''}">${on?'✓':''}</span>`;
function inspector(){let tab=state==='voice'?'voice':state==='speed'?'speed':'basic';let body;
if(state==='multiselect')body=`<div class="cliphead">${icon('audio')} 2 clips selected</div><div class="section"><div class="labelrow">Volume <span class="value">Mixed</span></div>${slider(50)}<div class="hint">Changing a shared value applies it to both selected clips.</div></div><div class="fades"><div>Fade in<div class="value" style="margin-top:10px">Mixed</div></div><div>Fade out<div class="value" style="margin-top:10px">0.25 s</div></div></div><div class="hint" style="margin-top:25px">2 clips · 1 track<br>Each clip keeps its own source and timing.</div>`;
else if(tab==='voice')body=`<div class="cliphead">${icon('audio')} stone_door_slide.wav</div><div class="section"><div class="labelrow">Voice filters <span class="tag">Local effects</span></div><div class="presets">${['Original','Low pitch','High pitch','Radio','Echo','Tremolo'].map((x,i)=>`<div class="preset ${i===0?'selected':''}">${icon(i===0?'wave':i===3?'speaker':'mic')}<span>${x}</span></div>`).join('')}</div></div><div class="labelrow">Intensity <span class="value">50%</span></div>${slider(50)}<div class="hint">Choose a filter to adjust its parameters.</div><div class="section" style="margin-top:25px"><div class="labelrow small">Bypass effect ${toggle(false)}</div></div><div class="hint">Source audio remains unchanged.</div>`;
else if(tab==='speed')body=`<div class="cliphead">${icon('audio')} stone_door_slide.wav</div><div class="section"><div class="labelrow">Times <span class="value">1.0×</span></div>${slider(32)}<div class="hint">0.25× <span style="float:right">4.0×</span></div></div><div class="section"><div class="labelrow small">Duration <span class="value">8.50 s</span></div><div class="hint">Original 8.50 s → 8.50 s</div></div><div class="labelrow small">Voice tone change ${toggle(false)}</div><div class="hint">Off keeps the original pitch when speed changes.</div><div class="reset" style="margin-top:65px">Reset</div>`;
else body=`<div class="cliphead">${icon('audio')} stone_door_slide.wav</div><div class="section"><div class="labelrow">Volume <span style="display:flex;align-items:center;gap:10px">${icon('diamond')}<span class="value">−6.0 dB</span></span></div>${slider(58)}<div class="labelrow small">Fade in <span class="value">0.08 s</span></div><div class="labelrow small" style="margin-bottom:0">Fade out <span class="value">0.25 s</span></div></div><div class="section"><div class="labelrow small"><span>${check(true)}Normalize loudness</span> ${icon('reset')}</div><div class="hint">Consistent level across the selected clip.</div></div><div class="section"><div class="labelrow small"><span>${check(false)}Enhance voice</span> ${toggle(false)}</div><div class="labelrow small" style="margin-bottom:0"><span>${check(true)}Reduce noise</span> ${toggle(true)}</div></div><div class="labelrow small">Channel balance <span class="value">0</span></div>${slider(50)}<div class="reset">Reset</div>`;
return `<section class="panel inspector"><div class="tabs">${[['basic','Basic'],['voice','Voice changer'],['speed','Speed']].map(([s,l])=>`<button data-view="${s}" class="${tab===s?'active':''}">${l}</button>`).join('')}</div><div class="inspectbody">${body}</div></section>`}
function asset(name,dur,meta,seed,cl=''){return `<div class="asset"><div class="thumb ${cl}">${wave(seed,300)}<span class="dur">${dur}</span></div><div class="assetname">${name}</div><div class="assetmeta">${meta}</div></div>`}
function clip(name,left,width,seed,cl='',keys=false){return `<div class="clip ${cl}" style="left:${left}%;width:${width}%"><div class="cliptop">${icon('audio')}${name}</div>${wave(seed,500)}${keys?'<svg class="automation" viewBox="0 0 300 60" preserveAspectRatio="none"><path d="M0 42L65 42L120 17L225 17L300 39" stroke="#e9eee4" stroke-width="1.4" fill="none"/><g fill="#f1efe5"><circle cx="65" cy="42" r="3"/><circle cx="120" cy="17" r="3"/><circle cx="225" cy="17" r="3"/></g></svg>':''}</div>`}
function track(n,name,content,locked=false,muted=false){return `<div class="track"><div class="trackhead"><div class="tracktitle">${icon('audio')}<span>${name}</span><span class="num">A${n}</span></div><div class="trackactions"><span class="${locked?'enabled':''}" title="${locked?'Track locked':'Lock track'}">${icon('lock')}</span><span>${icon('eye')}</span><span class="${muted?'mutetrack':''}">${icon(muted?'mute':'speaker')}</span><span class="solo" title="Solo · proposed addition">S</span></div></div><div class="tracklane">${content}</div></div>`}
function dialog(){let body='',title='',foot='';if(state==='export'){title='Export audio';body=`<div class="labelrow"><span>File name</span><span class="value" style="width:70%;text-align:left">citadel_door_mix.wav</span></div><div class="fields"><div class="field"><label>Format</label><div class="plainfield">WAV ${icon('chevron')}</div></div><div class="field"><label>Sample rate</label><div class="plainfield">44,100 Hz ${icon('chevron')}</div></div><div class="field"><label>Channels</label><div class="plainfield">Stereo ${icon('chevron')}</div></div><div class="field"><label>Bit depth</label><div class="plainfield">16-bit PCM ${icon('chevron')}</div></div></div><div style="margin-top:21px">Range</div><div class="choice"><span class="radio"></span><div>Entire project<div class="caption">00:00.000 — 00:30.000</div></div></div><div class="choice selected"><span class="radio"></span><div>In / Out range<div class="caption">00:04.000 — 00:26.500 · 22.500 s</div></div></div><div class="hint">All audible tracks are included. Muted tracks are excluded.</div><div class="labelrow small" style="margin-top:20px;margin-bottom:0"><span>Save to</span><span class="muted">mod/sound/doors/ &nbsp; Browse…</span></div>`;foot='<button class="soft" data-view="basic">Cancel</button><button class="primary" data-view="basic">Export audio</button>'}
if(state==='record'){title='Record audio';body=`<div class="miccircle">${icon('mic')}</div><div class="labelrow small"><span>Input device</span><span class="plainfield" style="width:65%">Default microphone ${icon('chevron')}</span></div><div class="recordlevels">${Array.from({length:28},(_,i)=>`<i style="height:${10+Math.abs(Math.sin(i*.6))*22}px;opacity:${i>19?.2:1}"></i>`).join('')}</div><div class="labelrow small">Input volume <span class="value">100%</span></div>${slider(72)}<div class="labelrow small">Mute project while recording ${toggle(true)}</div><div class="labelrow small">Countdown <span class="value">3 s</span></div><div class="hint">Recording will start at 00:12.640 on the Voiceover track.</div>`;foot='<button class="soft" data-view="basic">Cancel</button><button class="primary" data-view="basic" style="background:#e27e79;border-color:#e27e79;color:#291210">● &nbsp; Start recording</button>'}
if(state==='shortcuts'){title='Keyboard shortcuts';body=`<div class="labelrow small">Preset <span class="plainfield" style="width:65%">Reyond audio · v1 proposal ${icon('chevron')}</span></div><div class="search">${icon('search')} Search commands</div><div class="tabs" style="margin:15px -23px 8px"><button class="active">Timeline</button><button>Player</button><button>Project</button></div><table class="keys">${[['Play / Pause','Space','Reference'],['Split selected clip','Ctrl + B','Reference'],['Select tool','A','Proposed'],['Split tool','B','Proposed'],['Undo','Ctrl + Z','Proposed'],['Redo','Ctrl + Shift + Z','Proposed'],['Set export In / Out','I / O','Reference'],['Split all unlocked tracks','Ctrl + Shift + B','Proposed'],['Delete selected clips','Delete','Proposed']].map(([a,k,s])=>`<tr><td>${a} <span class="state">${s}</span></td><td><span class="kbd">${k}</span></td></tr>`).join('')}</table><div class="hint">Full proposed map is included in shortcuts.csv.<br>Secondary bindings are not verified against a CapCut build.</div>`;foot='<button class="soft">Reset preset</button><button class="primary" data-view="basic">Done</button>'}
if(state==='missing'){title='Source file unavailable';body=`<div class="notice">The source for <strong>voiceover_take02.wav</strong> could not be found. Your timeline edits are preserved.</div><div class="field" style="margin-top:22px"><label>Expected location</label><div class="fakeinput">mod/sound/voice/voiceover_take02.wav</div></div><div class="hint" style="margin-top:15px">Relink the original file, or leave this clip offline. Export will ask you to resolve missing audio first.</div>`;foot='<button class="soft" data-view="basic">Keep offline</button><button class="primary" data-view="basic">Locate file…</button>'}
if(state==='source-conflict'){title='Source changed outside the editor';body=`<div class="notice">stone_door_slide.wav was modified after it was imported. The original file has not been replaced.</div><div class="hint" style="margin:23px 0">Export a new file to preserve both versions, or reload the source and review your edits.</div><div class="field"><label>Resource</label><div class="fakeinput">mod/pak0.pak/sound/doors/stone_door_slide.wav</div></div>`;foot='<button class="soft" data-view="basic">Cancel</button><button class="soft" data-view="basic">Reload source</button><button class="primary" data-view="export">Export copy…</button>'}
return title?`<div class="veil"><section class="dialog" role="dialog" aria-label="${title}"><div class="dialoghead">${title}<button data-view="basic" aria-label="Close dialog">${icon('close')}</button></div><div class="dialogbody">${body}</div><div class="dialogfoot">${foot}</div></section></div>`:''}
function render(){const multi=state==='multiselect';document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div class="brand">${icon('wave')}ReyondBroom</div><button class="menu" data-view="menu" data-action="project.menu">Menu ${icon('chevron')}</button><div class="saved"><b>◉</b> <span>Sound editor · Mockup v1</span></div><div class="title">Citadel · Door & atmosphere</div><div class="topright">${btn('workspace.layout','grid','Workspace layout')}<button class="soft" data-view="shortcuts" data-action="shortcuts.open">${icon('key')}Shortcut</button><button class="primary" data-view="export" data-action="export.open">${icon('up')}Export</button></div></header><main class="upper"><section class="panel library"><div class="tabs"><button class="active">${icon('folder')}Media</button><button>${icon('audio')}Audio</button><span class="workspace-label">Project library</span></div><div class="libbody"><aside class="side"><div class="active">⌄ Local</div><div>Import</div><div>Game sounds</div><div>Favourites</div><small>4 ASSETS<br>MOD / SOUND</small></aside><div class="assets"><div class="search">${icon('search')}Search media</div><div class="assettools"><button class="soft" style="padding:5px 9px">${icon('plus')}Import</button><span class="quiet">${icon('grid').replace('class="icon"','class="icon" style="width:13px;vertical-align:middle"')} &nbsp; Sort &nbsp;⌄</span></div><div class="assetgrid">${asset('citadel_ambience.wav','00:30','WAV · 44.1 kHz · Stereo',2)}${asset('stone_door_slide.wav','00:08','WAV · 22.05 kHz · Mono',4,'selected')}${asset('door_latch.wav','00:02','WAV · 44.1 kHz · Mono',7,'gold')}${asset('voiceover_take02.wav','00:11','WAV · 48 kHz · Mono',11,'violet')}</div><div class="libfoot">${icon('folder').replace('class="icon"','class="icon" style="width:13px;height:13px;vertical-align:middle"')} &nbsp; mod / sound / doors</div></div></div></section><section class="panel player"><div class="panelhead"><span>Player</span>${icon('menu')}</div><div class="monitor"><div class="overline"><small>MASTER OUTPUT</small><small>STEREO</small></div>${wave(3)}<div class="meters"><div class="meter"></div><div class="meter"></div></div><div class="monitorfooter"><span>Peak −3.2 dBFS</span><span title="Master output gain · proposed control" style="display:flex;align-items:center;gap:6px">${icon('speaker').replace('class="icon"','class="icon" style="width:13px;height:13px"')}<span class="value" style="font-size:10px;min-width:48px;padding:3px 5px">0.0 dB</span></span></div></div><div class="transport"><div class="timecode"><span>00:12.640</span> / 00:30.000</div><div class="transportbuttons">${btn('transport.stop','stop','Stop')}${btn('transport.play','play','Play / Pause · Space')}</div><span class="muted">${icon('fit')}</span></div></section>${inspector()}</main><section class="panel timeline"><div class="tools">${btn('tool.select','select','Select · A',true)}${icon('chevron').replace('class="icon"','class="icon" style="width:10px"')}<span class="divider"></span>${btn('edit.undo','undo','Undo · Ctrl+Z')}${btn('edit.redo','redo','Redo · Ctrl+Shift+Z')}<span class="divider"></span>${btn('clip.split','split','Split · Ctrl+B')}${btn('clip.trimLeft','left','Delete left · Q')}${btn('clip.trimRight','right','Delete right · W')}${btn('clip.delete','trash','Delete')}<span class="divider"></span>${btn('marker.add','flag','Add marker · M')}<div class="toolright">${btn('record.open','mic','Record audio',false,'record')}<span class="divider"></span>${btn('timeline.magnet','magnet','Track magnet',true)}${btn('timeline.snap','snap','Auto snapping',true)}${btn('timeline.linkage','link','Linkage',true)}${btn('timeline.previewAxis','axis','Preview axis')}<span class="divider"></span>${btn('timeline.fit','fit','Zoom to fit')}${btn('timeline.zoomOut','minus','Zoom out')}<div class="zoom"></div>${btn('timeline.zoomIn','plus','Zoom in')}</div></div><div class="trackarea"><div class="ruler"><div class="rulerhead"><span>TRACKS</span></div><div class="rulerline">${Array.from({length:10},(_,i)=>`<span style="left:${i*10}%">00:${String(i*3).padStart(2,'0')}</span>`).join('')}<div class="range"></div></div></div>${track(1,'Atmosphere',clip('citadel_ambience.wav',0,93.3,2),true)}${track(2,'Door & Foley',clip('stone_door_slide.wav',26.66,28.33,4,'selected',true)+clip('door_latch.wav',65,8.3,7,'gold'+(multi?' selected':'')))}${track(3,'Voiceover',clip('voiceover_take02.wav',13.33,37,11,'violet'+(multi?' dim':'')),false,multi)}<div class="addtrack">+ &nbsp; Add audio track</div><div class="playhead"></div></div><div class="scrollbar"></div></section><footer class="status"><span class="designlabel">DESIGN PREVIEW · v1</span><span>3 tracks · 4 clips</span><span>In 00:04.000 &nbsp; Out 00:26.500</span><span class="right">${multi?'2 clips selected':'stone_door_slide.wav selected'} &nbsp; · &nbsp; 44.1 kHz / Stereo</span></footer></div>${dialog()}${state==='menu'?'<div class="menuoverlay"><div>New audio project <span>Ctrl+N</span></div><div>Open project… <span>Ctrl+O</span></div><div>Save project <span>Ctrl+S</span></div><div>Save project as…</div><div style="border-top:1px solid #484852;margin-top:5px;padding-top:14px" data-view="export">Export mix / range…</div><div data-view="source-conflict">Update source with backup…</div><div>Close Sound Editor</div></div>':''}${params.get('review')==='1'?`<aside class="reviewnav">REYON-4 · Mockup v1 <select id="stateSelect">${['basic','voice','speed','export','record','shortcuts','multiselect','missing','source-conflict','menu'].map(x=>`<option ${state===x?'selected':''}>${x}</option>`).join('')}</select><a href="review.md">Review notes</a></aside>`:''}`;
 document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{state=el.dataset.view;render()}));const select=document.getElementById('stateSelect');if(select)select.onchange=()=>{state=select.value;render()};}
window.mockup={version:'v1',setState(s){state=s;render()}};render();
</script></html>
